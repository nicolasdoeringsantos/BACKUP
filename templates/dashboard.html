<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Backups — Controle Interno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <div class="logo-mark">B</div>
    <div>
      <h1>Painel de Backups</h1>
      <p class="subtitle">Controle interno &middot; Cloud Backup PRO</p>
    </div>
  </div>
  <div class="topbar-right">
    <div class="last-update" id="lastUpdate">
      <span class="dot" id="statusDot"></span>
      <span id="lastUpdateText">carregando…</span>
    </div>
    <button class="btn-refresh" id="refreshBtn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
        <path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/>
      </svg>
      Atualizar agora
    </button>
  </div>
</header>

<main>
  <section class="summary-grid" id="summaryGrid">
    <!-- preenchido via JS -->
  </section>

<section class="chart-card">
    <div class="donut-wrap">
      <svg viewBox="0 0 120 120" class="donut" id="donutChart">
        <circle cx="60" cy="60" r="50" fill="none" stroke="var(--border)" stroke-width="14"></circle>
        <circle cx="60" cy="60" r="50" fill="none" stroke="var(--success)" stroke-width="14"
                stroke-linecap="round" id="donutArc" transform="rotate(-90 60 60)"></circle>
      </svg>
      <div class="donut-center">
        <span class="donut-percent" id="donutPercent">0%</span>
        <span class="donut-label">corretos</span>
      </div>
    </div>
    <div class="chart-legend">
      <div class="legend-item">
        <span class="legend-dot" style="background:var(--success)"></span>
        <span>Corretos — <b id="legendCorrectCount">0</b></span>
      </div>
      <div class="legend-item">
        <span class="legend-dot" style="background:var(--error)"></span>
        <span>Incorretos — <b id="legendIncorrectCount">0</b></span>
      </div>
    </div>
  </section>

<section class="chart-card">
    <div class="donut-wrap">
      <svg viewBox="0 0 120 120" class="donut" id="donutChart">
        <circle cx="60" cy="60" r="50" fill="none" stroke="var(--border)" stroke-width="14"></circle>
        <circle cx="60" cy="60" r="50" fill="none" stroke="var(--success)" stroke-width="14"
                stroke-linecap="round" id="donutArc" transform="rotate(-90 60 60)"></circle>
      </svg>
      <div class="donut-center">
        <span class="donut-percent" id="donutPercent">0%</span>
        <span class="donut-label">corretos</span>
      </div>
    </div>
    <div class="chart-legend">
      <div class="legend-item">
        <span class="legend-dot" style="background:var(--success)"></span>
        <span>Corretos — <b id="legendCorrectCount">0</b></span>
      </div>
      <div class="legend-item">
        <span class="legend-dot" style="background:var(--error)"></span>
        <span>Incorretos — <b id="legendIncorrectCount">0</b></span>
      </div>
    </div>
  </section>
  <section class="panel">
    <div class="panel-head">
      <div class="filter-tabs" id="filterTabs">
        <button class="tab active" data-filter="all">Todos</button>
        <button class="tab" data-filter="error">Erro</button>
        <button class="tab" data-filter="warning">Aviso</button>
        <button class="tab" data-filter="stale">Desatualizado</button>
        <button class="tab" data-filter="nomon">Sem monitoramento</button>
        <button class="tab" data-filter="success">Atualizado</button>
      </div>
      <input type="text" id="searchInput" class="search-input" placeholder="Buscar cliente ou tarefa…">
    </div>

    <div class="table-wrap">
      <table id="dataTable">
        <thead>
          <tr>
            <th data-sort="client_name">Cliente</th>
            <th data-sort="backup_set_name">Tarefa de backup</th>
            <th data-sort="status">Status</th>
            <th data-sort="last_backup_job_date">Última execução</th>
            <th data-sort="last_success_backup_job_date">Último sucesso</th>
            <th>Detalhe</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- preenchido via JS -->
        </tbody>
      </table>
      <div id="emptyState" class="empty-state" style="display:none;">
        Nenhum resultado para esse filtro.
      </div>
    </div>
  </section>
</main>

<div id="toast" class="toast"></div>

<script src="/static/dashboard.js"></script>
</body>
</html>
